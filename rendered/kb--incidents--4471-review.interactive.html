Its rendered cause table contradicts that summary: the shared parser and the booking-form
hint fail in different ways. They need separate tickets and separate verification.</p> <aside class="note svelte-17bri61"><!---->This review covers the export dated 2026-10-04, not the desk's current queue.
The review date records when the evidence was checked; it does not make that evidence live.
The tables recompute from the bundled data. New reports require a fresh export and rebuild.<!----></aside><!----> <section aria-label="Recomputed report coverage"><p><strong>412 unique reports</strong> from 427 export rows;
    15 overlapping rows excluded by report ID. <!--[-1--><!--]--> Received 2026-04-01 through 2026-10-04.</p> <table><thead><tr><th>Problem</th><th>Filed reports</th><th>Tenants</th><th>Issue</th></tr></thead><tbody><!--[--><tr><td>Shared parser reads day-first input month-first</td><td>379</td><td>11</td><td><!--[0--><a href="https://github.com/3750/mega-s01e03-what-it-shows/issues/1">parser issue</a><!--]--></td></tr><tr><td>booking-v3 prints a month-first hint but interprets input day-first</td><td>33</td><td>3</td><td><!--[0--><a href="https://github.com/3750/mega-s01e03-what-it-shows/issues/2">hint issue</a><!--]--></td></tr><!--]--></tbody></table> <p>38 intake tags disagree with the tenant/form/channel classifier.
    Tags and matching subjects are not evidence of a shared root cause.</p></section> <section aria-label="Unresolved report bodies"><h2>Unresolved evidence, included in parser coverage</h2> <p>5 report bodies do not establish the expected month/day reversal.
    They remain included in the parser-assigned total above, not an additional cause count.
    A tenant lookup cannot diagnose their bodies. Do not mark these resolved by the parser fix without reproducing them.</p> <ul><!--[--><li><code>R-41202</code> — Invite says Tuesday 12 May. Calendar says Monday 11 May. My client turned up on the Monday. We had coffee.</li><li><code>R-41209</code> — Every booking in June is one day off. Only June. Why only June.</li><li><code>R-41236</code> — The invite arrived before I made the booking. I would like to know how.</li><li><code>R-41344</code> — Client in Lisbon got Tuesday. Client in Toronto got Monday. Same meeting. We held it twice.</li><li><code>R-41620</code> — Tuesday 6 October showed as Monday. I moved it myself. I have stopped reporting these but my colleague says it helps you.</li><!--]--></ul> <p>Investigate original timestamps, timezone offsets, date-only conversion, invite generation,
    and the meaning of “arrived before” separately. The export does not prove that these reports share a timezone or DST bug.</p></section> <section aria-label="Arrival and merge history"><h2>A merge spike is not an arrival spike</h2> <p>On 2026-07-02, 184 reports were merged, while
    2 reports arrived. Keep receipt and merge timestamps separate;
    the chart does not explain why the older queue waited.</p></section><!----> <h2>Engineering disposition reported after the export</h2> <p>The <a href="https://hq.mega.dev/challenges/what-it-shows" rel="nofollow">challenge page</a> subsequently reports
that ticket #4471 closed on 2026-10-05:</p> <ul><li><strong>Parser: fixed</strong>, with the message <code>fix(dates): parse dd/mm for eu locales</code>. <a href="https://github.com/3750/mega-s01e03-what-it-shows/issues/1" rel="nofollow">Our parser ticket</a> is closed as completed on that reported disposition.</li> <li><strong>Hint: won’t fix</strong>, because booking-v3 was retired. <a href="https://github.com/3750/mega-s01e03-what-it-shows/issues/2" rel="nofollow">Our hint ticket</a> is closed as not planned, not described as a code fix.</li></ul> <p>These are engineering’s reported outcomes, not product-level tests performed in this review.
The counts above remain the historical export coverage. Closing the parser ticket does not
establish a diagnosis or fix for the unresolved body-level exceptions.</p> <h2>Different failures, different fixes</h2> <p><strong>Shared parser:</strong> Harbour Dental’s app report <code>R-41200</code> describes 7 April becoming 4 July.
For a day-first tenant, the shared parser wrongly reads input month-first.
Use tenant-aware parsing, reject invalid dates, and round-trip the user’s intended calendar date
through storage and invite creation. Verify app, email, and booking-v2 form paths.</p> <p><strong>booking-v3 hint:</strong> <code>R-41230</code> from Copper Studio’s form is assigned to the hint problem,
despite its parser intake tag. The field prints <code>MM/DD/YYYY</code>, so people follow that format;
the form then interprets their input in the tenant’s day-first order.
Make the displayed hint and accepted input agree. Verify Alder Physio, Copper Studio,
and Pale Harbour forms, plus app/email paths that still use the shared parser.
Changing only the shared parser does not correct the misleading field hint.</p> <h2>Triage by evidence, not by subject</h2> <p>The explorer below runs the existing tenant, locale, form, and channel logic.
Its initial reports have matching subjects but different assigned causes.
Conversely, an app report and an email report can share a cause despite different subjects.

n</td><td>no</td><td class="svelte-gq0h2h dup">yes</td></tr><tr><td>no tenant on file</td><td>yes</td><td class="svelte-gq0h2h">no</td></tr><!--]--></tbody></table><!----> <p>The immutable <a href="/kb/decisions/0001-dedupe-by-subject">accepted decision 0001</a> records the old

lass="svelte-18a6qal">09-14</text><!--]--><rect class="in svelte-18a6qal" x="602" y="96.77248677248677" width="9" height="13.227513227513226"></rect><rect class="merged svelte-18a6qal" x="612" y="97.83068783068784" width="9" height="12.16931216931217"></rect><!--[-1--><!--]--><rect class="in svelte-18a6qal" x="626" y="102.06349206349206" width="9" height="7.936507936507936"></rect><rect class="merged svelte-18a6qal" x="636" y="101.00529100529101" width="9" height="8.994708994708994"></rect><!--[-1--><!--]--><!--]--></svg> <figcaption class="svelte-18a6qal"><span class="key in svelte-18a6qal"></span> received · <span class="key merged svelte-18a6qal"></span> merged into #4471 · per week</figcaption></figure><!----> <h2>Keep the review current</h2> <p>When the desk provides new data, reconcile by report ID, inspect changed copies rather than

handled by the desk. New mechanisms need their own investigation and ticket.</p> <p>Recompute the coverage, reconcile every unique report exactly once, update the GitHub issues,

their fixes are reproduced. Do not claim a live update from a static import.</p> <h2>Evidence</h2> <ul><li>Report export: <code>src/lib/data/reports-4471.json</code>, deduplicated by <code>id</code> and filtered to ticket <code>4471</code>.</li> <li>Assignment: <code>src/lib/kb/causes.ts</code> and tenant/form metadata in <code>src/lib/data/tenants/</code>.</li> <li>Body-level exceptions: <code>src/lib/data/desk-notes.json</code> and the original report bodies.</li> <li>The numbers above are calculated by <code>IncidentReview.svelte</code>, not typed into this page.</li></ul> <!--[0--><p class="stamp svelte-1280m42">desk ref <b class="svelte-1280m42">DR-QEB3-KZXB</b></p><!--]--><!----><!----></main> <footer class="svelte-e2jw2j">Pages are written by people. Tables and charts are built from data at render time.</footer></div><!--]--></noscript></body></html>
